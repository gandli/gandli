name: Update README Projects

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  repository_dispatch:
    types: [update-readme]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Append missing repos to Ideas table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update-readme.py

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet README.md && echo "No changes" && exit 0
          BRANCH="chore/readme-update-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "docs: append new repos to profile README"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "docs: append new repos to profile README" \
            --body "Auto-opened by the Update README Projects workflow: repos not yet listed in the profile README were appended to the Ideas section. Review, then squash-merge."
