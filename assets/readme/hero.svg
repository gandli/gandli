<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">gandli — Cybersecurity Enthusiast · Full-Stack Tinkerer · AI-Powered Builder</title>
  <desc id="desc">A dark terminal window showing gandli's identity: whoami output, skill list, and a location prompt.</desc>

  <rect width="1200" height="340" rx="26" fill="#0d1117"/>

  <!-- terminal chrome -->
  <rect x="40" y="36" width="1120" height="268" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="74" cy="66" r="7" fill="#ff5f57"/>
  <circle cx="98" cy="66" r="7" fill="#febc2e"/>
  <circle cx="122" cy="66" r="7" fill="#28c840"/>
  <text x="600" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">gandli@github — ~/profile</text>

  <!-- whoami -->
  <text x="74" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#3fb950">❯</text>
  <text x="104" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#58a6ff">whoami</text>
  <text x="74" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#e6edf3">gandli</text>
  <text x="230" y="158" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#8b949e">Cybersecurity Enthusiast · Full-Stack Tinkerer · AI-Powered Builder</text>

  <!-- cat skills -->
  <text x="74" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#3fb950">❯</text>
  <text x="104" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#58a6ff">cat skills.txt</text>
  <text x="74" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#e6edf3">Rust · Go · Python · TypeScript · Vue · React · Swift</text>
  <text x="74" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b949e">CTF · Web · Pwn · Crypto · RE · Forensics · OSINT</text>

  <!-- prompt with cursor -->
  <text x="74" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#3fb950">❯</text>
  <text x="104" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e6edf3">./deploy --location fuzhou,china</text>
  <rect x="500" y="282" width="11" height="19" fill="#3fb950" rx="2"/>

</svg>
